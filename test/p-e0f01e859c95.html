<script>
(async function openPreview(){
  const message=document.getElementById("message");
  const fragment=window.location.hash.slice(1);
  if(!/^[A-Za-z0-9_-]{43}$/.test(fragment)){message.textContent="Bitte öffne den vollständigen Testlink.";return;}
  const bytes=value=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
  try{
    const normalized=fragment.replace(/-/g,"+").replace(/_/g,"/")+"=";
    const key=await crypto.subtle.importKey("raw",bytes(normalized),"AES-GCM",false,["decrypt"]);
    const packed=bytes(document.getElementById("payload").textContent);
    const content=await crypto.subtle.decrypt({name:"AES-GCM",iv:packed.subarray(0,12)},key,packed.subarray(12));
    document.open();
    document.write(new TextDecoder().decode(content));
    document.close();
  }catch(error){message.textContent="Der Testlink konnte nicht geöffnet werden. Prüfe bitte, ob er vollständig ist."; }
})();
